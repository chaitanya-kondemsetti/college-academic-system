<!DOCTYPE html>
<head>
    <title>Internal Calculator</title>
    <link rel="stylesheet" href="internal-marks.css">
</head>

<body>

<div class="internal-box">

    <h2 class="heading"><b>Internal Calculator</b></h2>

    <div class="con-1">
        <div class="aat-sec">
            <h3>AAT-1</h3>
            <input id="aat1" type="number" placeholder=" Enter AAT-1 Marks" required>

            <h3>AAT-2</h3>
            <input id="aat2" type="number" placeholder="Enter AAT-2 Marks" required>
        </div>

        <div class="mid-sec">
            <h3>MID-1</h3>
            <input id="mid1" type="number" placeholder="Enter Mid-1 Marks" required>

            <h3>MID-2</h3>
            <input id="mid2" type="number" placeholder="Enter Mid-2 Marks" required>
        </div>
    </div>

    
    <div class="con2 result-row">
        <h3 class="output" style="padding-left:150px;">Total Marks</h3>
        <div id="resultBox" style="margin-left:50px;width:50px;"></div>
    </div>

    <div class="button">
        <button id="button">
            <h4><b>CALCULATE</b></h4>
        </button>
    </div>

</div>

<script src="internal-marks.js"></script>
</body>
</html>
